<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — Hide &amp; Speak</title>
  <link rel="stylesheet" href="../css/estilos.css" />
  <style>
    :root {
      --gold:   #FFC145;
      --gold-d: #f0ad2e;
      --orange: #F75C03;
      --panel:  #D9EFFF;
      --ink:    #1e2230;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 2fr 1fr;
      background: var(--panel);
    }

    .login-aside {
      position: relative;
      background: #0f1b3d center/cover no-repeat
        url('../img/image (13).png');
    }
    .login-aside::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(15,27,61,.25), rgba(37,99,235,.18));
    }

    .login-main {
      display: flex; align-items: center; justify-content: center;
      padding: 48px 40px;
      background: var(--panel);
    }
    .login-box { width: 100%; max-width: 440px; }
    .login-box h1 {
      font-size: 3.4rem; font-weight: 600; color: var(--ink);
      line-height: 1; margin: 0 0 2px; text-align: center;
    }
    .login-box .subtitle {
      color: #475569; font-size: 17px; margin-bottom: 30px;
      text-align: center;
    }

    .login-form .input-group { margin-bottom: 18px; }
    .login-form label {
      display: block; font-size: 16px; font-weight: 600;
      margin-bottom: 7px; color: var(--ink);
    }
    .login-form .input-wrap { position: relative; }
    .login-form input {
      width: 100%; padding: 14px 16px;
      border: 1px solid #cbd5e1; border-radius: 9px;
      font-family: inherit; font-size: 17px; color: var(--ink);
      background: white; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-form input:focus {
      border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    .login-form input::placeholder { color: #94a3b8; }
    .field-hint { font-size: 13px; color: #64748b; margin-top: 6px; }

    .btn-login {
      width: 100%; padding: 15px; margin-top: 6px;
      background: var(--gold); color: var(--ink);
      border: none; border-radius: 11px;
      font-family: inherit; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: var(--gold-d); transform: translateY(-1px); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-login .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.25); border-top-color: var(--ink);
      border-radius: 50%; animation: spin .6s linear infinite; display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-error, .alert-success {
      padding: 11px 14px; border-radius: 8px;
      font-size: 14px; margin-bottom: 16px; display: none;
    }
    .alert-error   { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
    .alert-success { background: #DCFCE7; color: #16A34A; border: 1px solid #BBF7D0; }

    .signup-line {
      text-align: center; margin-top: 26px;
      color: var(--ink); font-size: 16px; font-weight: 600;
    }
    .signup-line a { color: var(--orange); text-decoration: none; }
    .signup-line a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .login-aside { display: none; }
      .login-main { padding: 40px 24px; align-items: flex-start; padding-top: 56px; }
      .login-box h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <aside class="login-aside"></aside>

  <main class="login-main">
    <div class="login-box">
      <h1>Crear cuenta</h1>
      <p class="subtitle">Usá tu email institucional (@ort.edu.ar o @est.ort.edu.ar).</p>

      <div id="error" class="alert-error"></div>
      <div id="success" class="alert-success"></div>

      <form class="login-form" id="formRegister" novalidate>
        <div class="input-group">
          <label for="nombre">Nombre</label>
          <div class="input-wrap">
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required />
          </div>
        </div>

        <div class="input-group">
          <label for="usuario">Email institucional</label>
          <div class="input-wrap">
            <input type="text" id="usuario" name="usuario" placeholder="nombre@ort.edu.ar" autocomplete="username" required />
          </div>
          <div class="field-hint">Profesores: @ort.edu.ar · Alumnos: @est.ort.edu.ar</div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••" autocomplete="new-password" minlength="6" required />
          </div>
        </div>

        <div class="input-group">
          <label for="password2">Repetir contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password2" name="password2" placeholder="••••••" autocomplete="new-password" minlength="6" required />
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnRegister">
          <div class="spinner"></div>
          <span class="btn-label">Crear cuenta</span>
        </button>
      </form>

      <p class="signup-line">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="register.js"></script>
</body>
</html>
